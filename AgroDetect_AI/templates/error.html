<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - AgroDetect AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🌱 AgroDetect AI</h1>
            </div>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}">Home</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
                <li><a href="{{ url_for('upload') }}">Upload</a></li>
                <li><a href="{{ url_for('upload') }}" class="btn-nav">Detect Now</a></li>
            </ul>
        </div>
    </nav>

    <!-- Error Section -->
    <section class="error-section">
        <div class="container">
            <div class="error-card">
                <div class="error-icon">⚠️</div>
                <h2>Oops! Something Went Wrong</h2>
                <p class="error-message">{{ message }}</p>
                <div class="action-buttons">
                    <a href="{{ url_for('upload') }}" class="btn-primary">Try Again</a>
                    <a href="{{ url_for('home') }}" class="btn-secondary">Go Home</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2024 AgroDetect AI. Helping farmers and gardeners protect their plants.</p>
            <div class="footer-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('upload') }}">Upload</a>
            </div>
        </div>
    </footer>
</body>
</html>
